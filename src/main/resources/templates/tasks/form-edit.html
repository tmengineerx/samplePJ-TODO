<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスク編集</title>
</head>
<body>
	<div class="container form-plain">
		<h1>タスク編集</h1>

		<form th:action="@{/tasks/update/{id}(id=${taskId})}" th:object="${taskForm}" method="post">
				<label for="title">タイトル</label>
				<input id="title" type="text" th:field="*{title}">
				<span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
			<br>
				<label for="content">内容</label>
				<textarea id="content" th:field="*{content}"></textarea>
				<span class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
			<br>
				<label for="assignee">登録者</label>
				<input id="assignee" type="text" th:field="*{assignee}">
				<span class="field-error" th:if="${#fields.hasErrors('assignee')}" th:errors="*{assignee}"></span>
			<br>
				<label for="startDate">開始日</label>
				<input id="startDate" type="date" th:field="*{startDate}">
			<br>
				<label for="endDate">終了日</label>
				<input id="endDate" type="date" th:field="*{endDate}">
				<span class="field-error" th:if="${#fields.hasErrors('validPeriod')}" th:errors="*{validPeriod}"></span>
			<br>
			<button type="submit">更新</button>
			<a th:href="@{/tasks}" class="btn-cancel">← キャンセル</a>
		</form>
	</div>
</body>
</html>
