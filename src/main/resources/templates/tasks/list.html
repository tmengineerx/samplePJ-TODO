<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>タスク一覧</title>
</head>
<body>
	<div class="container">
		<h1 class="page-header">タスク一覧</h1>
		
		<div class="empty-state" th:if="${#lists.isEmpty(tasks)}">
			💬 現在タスクは登録されていません。「新規作成」から追加してください。
		</div>
		
		<table th:unless="${#lists.isEmpty(tasks)}">
			<tr>
				<th>ID</th>
				<th>タイトル</th>
				<th>内容</th>
				<th>名前</th>
				<th>開始日</th>
				<th>終了日</th>
				<th>作成日時</th>
				<th>更新日時</th>
				<th>操作</th>
			</tr>
			<tr th:each="task : ${tasks}">
				<td th:text="${task.id}"></td>
				<td th:text="${task.title}"></td>
				<td th:text="${task.content}"></td>
				<td th:text="${task.name}"></td>
				<td th:text="${task.startDate}"></td>
				<td th:text="${task.endDate}"></td>
				<td th:text="${task.createdAt}"></td>
				<td th:text="${task.updatedAt}"></td>
				<td>
					<a class="btn-edit" th:href="@{/tasks/edit/{id}(id=${task.id})}">編集</a>
					<form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post">
						<button type="submit" class="btn-delete">削除</button>
					</form>
				</td>
			</tr>
		</table>
		
		<div class="pagination" th:if="${totalPages >= 1}">
			<a th:if="${currentPage > 1}" th:href="@{/tasks(page=${currentPage - 1})}">« 前</a>
			<span th:unless="${currentPage > 1}" class="disabled">« 前</span>
			
			<span th:each="p : ${#numbers.sequence(1, totalPages)}">
				<a th:if="${p != currentPage}" th:href="@{/tasks(page=${p})}" th:text="${p}"></a>
				<strong th:if="${p == currentPage}" th:text="${p}"></strong>
			</span>
			<a th:if="${currentPage < totalPages}" th:href="@{/tasks(page=${currentPage + 1})}">次 »</a>
			<span th:unless="${currentPage < totalPages}" class="disabled">次 »</span>
		</div>
		
		<p class="actions"><a href="/tasks/new">新規登録</a></p>
		<p><a href="/logout">ログアウト</a></p>
	</div>
</body>
</html>
