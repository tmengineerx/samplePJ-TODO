<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>タスク一覧</title>
</head>
<body>
	<h1>タスク一覧</h1>
	
	<p><a href="/tasks/new">新規登録</a></p>
	
	<table border="1">
		<tr>
			<th>ID</th>
			<th>タイトル</th>
			<th>内容</th>
			<th>名前</th>
			<th>開始日</th>
			<th>終了日</th>
			<th>作成日時</th>
			<th>更新日時</th>
		</tr>
		<tr th:each="task : ${tasks}">
			<td th:text="${task.id}"></td>
			<td th:text="${task.title}"></td>
			<td th:text="${task.content}"></td>
			<td th:text="${task.name}"></td>
			<td th:text="${task.startDate}"></td>
			<td th:text="${task.endDate}"></td>
			<td th:text="${task.createdAt}"></td>
			<td th:text="${task.updatedAt}"></td>
			<td><a th:href="@{/tasks/edit/{id}(id=${task.id})}">編集</a></td>
			<td>
				<form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post">
					<button type="submit">削除</button>
				</form>
			</td>
		</tr>
	</table>
	
	<p><a href="/logout">ログアウト</a></p>
</body>
</html>
