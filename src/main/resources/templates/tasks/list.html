<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>タスク一覧</title>
</head>
<body>
	<div class="container container-wide">
		<h1>タスク一覧</h1>
		<div class="error-message" th:if="${error}" th:text="${error}"></div>

		<div class="empty-state" th:if="${#lists.isEmpty(page.items)}">
			💬 現在タスクは登録されていません。「新規作成」から追加してください。
		</div>

		<div class="table-wrapper" th:unless="${#lists.isEmpty(page.items)}">
			<table>
				<tr>
					<th>ID</th>
					<th>タイトル</th>
					<th>内容</th>
					<th>登録者</th>
					<th>開始日</th>
					<th>終了日</th>
					<th>作成日時</th>
					<th>更新日時</th>
					<th>操作</th>
				</tr>
				<tr th:each="task : ${page.items}">
					<td th:text="${task.id}"></td>
					<td th:text="${task.title}"></td>
					<td th:text="${task.content}"></td>
					<td th:text="${task.name}"></td>
					<td th:text="${task.startDate}"></td>
					<td th:text="${task.endDate}"></td>
					<td th:text="${task.createdAt}"></td>
					<td th:text="${task.updatedAt}"></td>
					<td>
						<a class="btn-edit" th:href="@{/tasks/edit/{id}(id=${task.id})}">編集</a>
						<form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post">
							<button type="submit" class="btn-delete">削除</button>
						</form>
					</td>
				</tr>
			</table>
		</div>

		<div class="list-footer">
			<div class="pagination" th:if="${page.totalPages}">
				<a th:if="${page.hasPrevious()}" th:href="@{/tasks(page=${page.currentPage - 1})}">« 前</a>
				<span th:unless="${page.hasPrevious()}" class="disabled">« 前</span>

				<span th:each="p : ${#numbers.sequence(1, page.totalPages)}">
					<a th:if="${p != page.currentPage}" th:href="@{/tasks(page=${p})}" th:text="${p}"></a>
					<strong th:if="${p == page.currentPage}" th:text="${p}"></strong>
				</span>
				<a th:if="${page.hasNext()}" th:href="@{/tasks(page=${page.currentPage + 1})}">次 »</a>
				<span th:unless="${page.hasNext()}" class="disabled">次 »</span>
			</div>
			<div class="new-task-row">
				<a href="/tasks/new" class="btn btn-green">＋新規作成</a>
			</div>
		</div>

		<form th:action="@{/logout}" method="post" class="logout-form">
			<button type="submit" class="btn-link">ログアウト</button>
		</form>
	</div>
</body>
</html>
