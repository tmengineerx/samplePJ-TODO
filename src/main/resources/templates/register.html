<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ユーザー登録</title>
</head>
<body>
	<h1>ユーザー登録</h1>
	
	<form action="/register" method="post">
		<label>ユーザー名：<input type="text" name="username"></label>
		<br>
		<label>パスワード：<input type="password" name="password"></label>
		<br>
		<button type="submit">登録</button>
	</form>
	
	<p><a href="/login">ログインはこちら</a></p>
</body>
</html>
