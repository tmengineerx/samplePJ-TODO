<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>ユーザー登録</title>
</head>
<body>
	<div class="container form-page">
		<h1>ユーザー登録</h1>
		
		<div class="error-message" th:if="${error}" th:text="${error}"></div>
		<form action="/register" method="post">
			<label>ユーザー名（半角英数字）：<input type="text" name="username" pattern="[a-zA-Z0-9]+" required title="半角英数字のみで入力してください"></label>
			<br>
			<label>パスワード（半角英数字）：<input type="password" name="password" pattern="[a-zA-Z0-9]+" required title="半角英数字のみで入力してください"></label>
			<br>
			<button type="submit" class="btn-full">登録</button>
		</form>
		
		<p><a href="/login">ログインはこちら</a></p>
	</div>
</body>
</html>
