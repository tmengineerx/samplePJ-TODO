<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ユーザー登録</title>
</head>
<body>
	<div class="container form-page">
		<h1>ユーザー登録</h1>
		
		<form th:action="@{/register}" th:object="${registerForm}" method="post">
			<label for="username">ユーザー名（半角英数字）：</label>
				<input id="username" type="text" th:field="*{username}" pattern="[a-zA-Z0-9]+" required title="半角英数字のみで入力してください">
			<span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
			
			<label for="password">パスワード（半角英数字）：</label>
				<input id="password" type="password" th:field="*{password}" pattern="[a-zA-Z0-9]+" required title="半角英数字のみで入力してください">
			<span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
			
			<button type="submit" class="btn-full">登録</button>
		</form>
		
		<p><a th:href="@{/login}">ログインはこちら</a></p>
	</div>
</body>
</html>
