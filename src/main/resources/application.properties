spring.application.name=samplePJ-TODO

# 既定プロファイル。起動時に -Dspring.profiles.active=prod で上書きできる
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Postgres接続先設定
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/todo_app
spring.datasource.username=${DB_USER:todo_app}
spring.datasource.password=${DB_PASSWORD}

# MyBatis設定
mybatis.type-aliases-package=sample.common.dao.entity
mybatis.mapper-locations=classpath:common/dao/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# セッション（30分無操作でタイムアウト）
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# エラー画面に内部情報を出さない
server.error.include-stacktrace=never
server.error.include-message=never